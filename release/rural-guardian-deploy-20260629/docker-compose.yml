version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rural-guardian-backend
    ports:
      - "8080:8080"   # HTTP API
      - "1883:1883"   # MQTT TCP
      - "8884:8884"   # MQTT WebSocket
    volumes:
      - backend-data:/app/data          # SQLite 数据库持久化
      - ./backend/.env:/app/.env:ro     # 环境变量（可选）
    environment:
      - NODE_ENV=production
      - ALLOW_DEMO_LOGIN=false
      - CORS_ORIGINS=
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 可选：Nginx 反向代理（前端静态资源 + API 代理）
  nginx:
    image: nginx:alpine
    container_name: rural-guardian-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  frontend-dist:
